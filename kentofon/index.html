<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0906">
<title>Кентофон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: дерзко и дорого, голосовая тусовка своих
   IDEA: голосовая комната как в дискорде, только золотая
   PICTURE: плитки участников с золотым кольцом, которое светится, когда человек говорит
   COLOUR/TYPE: почти чёрный, золото, белый текст; Unbounded + Manrope
   LAYOUT: лобби — одна карточка по центру; комната — код сверху, плитки, панель снизу */
:root{color-scheme:dark;--bg:#0b0906;--card:rgba(255,236,190,.05);--line:rgba(245,215,122,.16);--ink:#f7f1e3;--dim:#a99c7e;
--gold:linear-gradient(135deg,#8a6414 0%,#f9e08b 22%,#c99a2e 45%,#fff3c4 58%,#c4921f 78%,#f5d77a 100%);--g:#f2cc5d;--red:#ff5a4a;--ok:#7be07f}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(242,204,93,.22),transparent 60%),radial-gradient(ellipse 60% 50% at 100% 110%,rgba(242,204,93,.08),transparent 60%),var(--bg);
color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px 24px}
.logo{font:800 clamp(34px,8vw,52px)/1.05 Unbounded,sans-serif;letter-spacing:-.02em;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 6px;text-align:center}
.sub{color:var(--dim);text-align:center;margin:0 0 26px}
.card{width:min(420px,100%);padding:22px;border-radius:28px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--dim);margin:0 0 6px}
input{width:100%;height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.35);font-size:17px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(242,204,93,.15)}
#code{text-transform:uppercase;letter-spacing:.3em;font:800 20px Unbounded,sans-serif;text-align:center}
.btn{position:relative;overflow:hidden;width:100%;height:54px;border:0;border-radius:16px;cursor:pointer;font-weight:700;font-size:16px;transition:transform .08s,filter .2s}
.btn:active{transform:scale(.98)}
.gold{background:var(--gold);color:#2a1c02;box-shadow:0 10px 30px rgba(242,204,93,.25),inset 0 1px 0 rgba(255,255,255,.7)}
.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-100%);animation:sh 3.5s ease-in-out infinite}
@keyframes sh{60%,100%{transform:translateX(100%)}}
.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.row{display:flex;gap:10px}.row>*{flex:1}
.gap{height:14px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px;margin:18px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.last{margin-top:14px;text-align:center;font-size:14px;color:var(--dim)}.last button{background:none;border:0;color:var(--g);cursor:pointer;font-weight:700;padding:6px}
/* комната */
.room{width:min(900px,100%);min-height:100%;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 18px}
.rc{display:flex;align-items:center;gap:12px}
.rc .lbl{font-size:13px;color:var(--dim)}
.rc .cd{font:800 28px/1 Unbounded,sans-serif;letter-spacing:.14em;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-size:14px;font-weight:700;color:var(--ink)}
.st{font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}.dot.wait{background:var(--g);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,44%),1fr));gap:14px;align-content:start;padding-bottom:120px}
.tile{--lvl:0;position:relative;aspect-ratio:1/1.05;border-radius:26px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;transition:border-color .15s}
.tile.talk{border-color:rgba(242,204,93,.7)}
.av{position:relative;width:min(96px,52%);aspect-ratio:1;border-radius:50%;background:var(--gold);display:grid;place-items:center;font:800 clamp(26px,6vw,36px) Unbounded,sans-serif;color:#2a1c02;
box-shadow:0 0 0 calc(var(--lvl)*10px) rgba(242,204,93,.25),0 0 calc(var(--lvl)*40px) rgba(242,204,93,.6);transition:box-shadow .08s}
.nm{font-weight:700;font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{font-size:13px;color:var(--dim)}.ps.ok{color:var(--ok)}.ps.bad{color:var(--red)}
.mute-badge{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.mute-badge svg{width:16px;height:16px;fill:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:20px;border:1px dashed var(--line);border-radius:22px}
.bar{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:12px;padding:10px;border-radius:24px;background:rgba(20,16,10,.8);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.rb{width:62px;height:56px;border-radius:18px;border:0;cursor:pointer;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.rb svg{width:26px;height:26px;fill:var(--ink)}
.rb.off{background:var(--red)}
.rb.leave{background:var(--red);width:84px}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-160%);opacity:0;padding:10px 18px;border-radius:14px;background:var(--gold);color:#2a1c02;font-weight:700;transition:transform .3s,opacity .3s;z-index:9;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.tap{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:8}.tap.on{display:grid}
button:focus-visible{outline:2px solid var(--g);outline-offset:3px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.gold::after,.dot.wait{animation:none}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="tap" id="tap"><button class="btn gold" style="width:auto;padding:0 28px">Включить звук</button></div>

<main class="wrap" id="lobby">
  <h1 class="logo">Кентофон</h1>
  <p class="sub">Создал комнату, скинул код — и вы на связи</p>
  <div class="card">
    <label for="nick">Твой ник</label>
    <input id="nick" maxlength="20" placeholder="Как тебя звать" autocomplete="nickname">
    <div class="gap"></div>
    <button class="btn gold" id="create">Создать комнату</button>
    <div class="or">или зайти по коду</div>
    <div class="row">
      <input id="code" maxlength="5" placeholder="КОД" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn ghost" id="join" style="flex:0 0 120px">Войти</button>
    </div>
    <div class="err" id="err"></div>
    <div class="last" id="last" hidden></div>
  </div>
</main>

<section class="room" id="room" hidden>
  <div class="top">
    <div class="rc"><div><div class="lbl">Код комнаты</div><div class="cd" id="rcode"></div></div>
      <button class="chip" id="copy">Скопировать</button></div>
    <div class="st"><span class="dot wait" id="sdot"></span><span id="stxt">Подключаюсь…</span></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="bar">
    <button class="rb" id="mute" aria-label="Микрофон"></button>
    <button class="rb leave" id="leave" aria-label="Выйти"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.5 11.5 0 0 0-2.66 1.85 1 1 0 0 1-1.4 0L.29 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7c4.5 0 8.6 1.75 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.49a1 1 0 0 1-1.4 0 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A14.8 14.8 0 0 0 12 9z"/></svg></button>
  </div>
</section>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PFX='kentofon-room-v2-';
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const OPTS={debug:0,config:{iceServers:[
  {urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},
  {urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}
]}};
const MIC_ON='<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>';
const MIC_OFF='<svg viewBox="0 0 24 24"><path d="M19 11h-2c0 .74-.16 1.43-.43 2.05l1.46 1.46A6.9 6.9 0 0 0 19 11zM15 11V5a3 3 0 0 0-5.94-.6L15 10.33zM4.27 3 3 4.27l6 6V11a3 3 0 0 0 4.53 2.58l1.65 1.65A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.92V21h2v-3.08a6.9 6.9 0 0 0 2.6-.9L19.73 21 21 19.73z"/></svg>';
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

let nick='',code='',me=null,myId='',host=null,toHost=null,local=null,muted=false,leaving=true,ac=null,joinT=null;
let members={};               // peerId -> ник (список от хоста)
const hostConns=new Map();     // у хоста: peerId -> data-соединение
const peers=new Map();         // peerId -> {call,state,audio,an,lvl,missing}

let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2400)}
const err=t=>$('#err').textContent=t;
function status(t,s){$('#stxt').textContent=t;$('#sdot').className='dot '+(s||'')}
const newCode=()=>Array.from({length:5},()=>AL[Math.floor(Math.random()*AL.length)]).join('');
const clean=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);

/* ---------- лобби ---------- */
$('#nick').value=ls.get('kf_nick')||'';
const hc=clean(location.hash.slice(1));if(hc.length===5){$('#code').value=hc}
const lastC=ls.get('kf_last');
if(lastC&&lastC!==hc){$('#last').hidden=false;$('#last').innerHTML='Последняя комната: <button id="lastbtn">'+esc(lastC)+' — зайти</button>';$('#lastbtn').onclick=()=>{$('#code').value=lastC;enter(lastC)}}
$('#code').addEventListener('input',e=>{e.target.value=clean(e.target.value)});
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')$('#join').click()});
$('#create').onclick=()=>enter(newCode());
$('#join').onclick=()=>{const c=clean($('#code').value);if(c.length!==5)return err('Код — 5 символов');enter(c)};

async function enter(c){
  nick=$('#nick').value.trim().slice(0,20);
  if(!nick){err('Впиши ник');$('#nick').focus();return}
  if(typeof Peer==='undefined')return err('Нет интернета, обнови страницу');
  err('');ls.set('kf_nick',nick);
  try{local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){return err('Разреши доступ к микрофону')}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  code=c;leaving=false;muted=false;members={};ls.set('kf_last',code);
  try{history.replaceState(null,'','#'+code)}catch(e){location.hash=code}
  $('#lobby').hidden=true;$('#room').hidden=false;$('#rcode').textContent=code;
  ensure('self');meter(peers.get('self'),local);
  renderMute();render();status('Подключаюсь…','wait');
  startMe();
}

/* ---------- сеть ---------- */
function startMe(){
  me=new Peer(OPTS);
  me.on('open',id=>{myId=id;members[myId]=nick;tryHost()});
  me.on('call',c=>{attach(c.peer,c);c.answer(local);watchIce(c.peer,c)});
  me.on('disconnected',()=>{if(!leaving){status('Нет сети, переподключаюсь…','wait');setTimeout(()=>{try{me.reconnect()}catch(e){}},1500)}});
  me.on('error',e=>{
    if(leaving)return;
    if(e.type==='peer-unavailable'){if(!toHost||!toHost.open)setTimeout(tryHost,500)}
    else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){status('Нет сети, переподключаюсь…','wait')}
  });
}
function tryHost(){
  if(leaving||!myId)return;
  clearTimeout(joinT);
  const h=new Peer(PFX+code,OPTS);
  h.on('open',()=>{host=h;members={[myId]:nick};for(const id of peers.keys())if(id!=='self'&&peers.get(id).state==='ok')members[id]=members[id]||'…';broadcast();status('Ты в комнате','on')});
  h.on('connection',c=>{
    c.on('data',d=>{if(d&&d.t==='join'&&typeof d.id==='string'){c.mid=d.id;hostConns.set(d.id,c);members[d.id]=String(d.nick||'Кент').slice(0,20);broadcast();toast(members[d.id]+' зашёл')}});
    c.on('close',()=>{if(c.mid&&hostConns.get(c.mid)===c){hostConns.delete(c.mid);const n=members[c.mid];delete members[c.mid];broadcast();if(n)toast(n+' вышел')}});
  });
  h.on('error',e=>{
    if(e.type==='unavailable-id'){h.destroy();joinHost()}
    else if(host===h&&!leaving){status('Нет сети, переподключаюсь…','wait')}
  });
  h.on('disconnected',()=>{if(host===h&&!leaving)setTimeout(()=>{try{h.reconnect()}catch(e){}},1500)});
}
function joinHost(){
  if(leaving)return;
  if(toHost){try{toHost.close()}catch(e){}}
  const c=me.connect(PFX+code,{reliable:true});toHost=c;
  joinT=setTimeout(()=>{if(toHost===c&&!c.open){status('Пробиваюсь в комнату…','wait');try{c.close()}catch(e){}toHost=null;tryHost()}},12000);
  c.on('open',()=>{clearTimeout(joinT);c.send({t:'join',id:myId,nick});status('Ты в комнате','on')});
  c.on('data',d=>{if(d&&d.t==='list'&&d.members&&typeof d.members==='object')applyList(d.members)});
  c.on('close',()=>{if(toHost===c&&!leaving){toHost=null;status('Комната переезжает…','wait');setTimeout(tryHost,200+Math.random()*1500)}});
}
function broadcast(){
  const list={...members};
  hostConns.forEach(c=>{if(c.open)try{c.send({t:'list',members:list})}catch(e){}});
  applyList(list);
}
function applyList(m){
  const out={};for(const k in m)out[String(k)]=String(m[k]).slice(0,20);
  out[myId]=nick;members=out;
  for(const id in members){
    if(id===myId)continue;
    const p=ensure(id);p.missing=0;
    if(myId<id&&!p.call)callPeer(id);   // звонит тот, у кого id меньше — без дублей
  }
  render();
}
function callPeer(id){
  if(leaving||!me||me.destroyed)return;
  const c=me.call(id,local,{metadata:{nick}});
  if(!c)return;
  attach(id,c);watchIce(id,c);
}
function attach(id,c){
  const p=ensure(id);
  if(p.call&&p.call!==c){const old=p.call;p.call=null;try{old.close()}catch(e){}}
  p.call=c;p.state='conn';
  if(c.metadata&&c.metadata.nick&&!members[id])members[id]=String(c.metadata.nick).slice(0,20);
  c.on('stream',s=>{p.audio.srcObject=s;p.audio.play().catch(()=>$('#tap').classList.add('on'));p.state='ok';meter(p,s);render()});
  c.on('close',()=>{if(p.call!==c)return;p.call=null;p.state='lost';render();retry(id)});
  c.on('error',()=>{if(p.call===c){p.state='bad';render();retry(id)}});
  render();
}
function watchIce(id,c){
  setTimeout(()=>{
    const pc=c.peerConnection;if(!pc)return;
    pc.addEventListener('iceconnectionstatechange',()=>{
      const st=pc.iceConnectionState,p=peers.get(id);if(!p||p.call!==c)return;
      if(st==='failed'){p.state='bad';render();try{c.close()}catch(e){}}
      else if(st==='disconnected'){p.state='lost';render()}
      else if(st==='connected'||st==='completed'){if(p.audio.srcObject){p.state='ok';render()}}
    });
  },0);
  setTimeout(()=>{const p=peers.get(id);if(p&&p.call===c&&p.state==='conn'){p.state='bad';render();try{c.close()}catch(e){}}},25000);
}
function retry(id){if(!leaving&&members[id]&&myId<id)setTimeout(()=>{const p=peers.get(id);if(p&&!p.call&&members[id])callPeer(id)},2500)}
function ensure(id){
  if(!peers.has(id)){const a=new Audio();a.autoplay=true;a.setAttribute('playsinline','');peers.set(id,{call:null,state:'conn',audio:a,an:null,lvl:0,missing:0})}
  return peers.get(id);
}
function drop(id){const p=peers.get(id);if(!p)return;if(p.call)try{p.call.close()}catch(e){}p.audio.srcObject=null;peers.delete(id)}
setInterval(()=>{ // убираем ушедших с задержкой, чтобы переезд хоста не рвал звук
  if(leaving)return;let ch=false;
  for(const [id,p] of peers){if(id==='self'||members[id])continue;p.missing++;if(p.missing>=3||p.state!=='ok'){drop(id);ch=true}}
  if(ch)render();
},2000);

/* ---------- звук: кто говорит ---------- */
function meter(p,s){try{if(!ac)return;const src=ac.createMediaStreamSource(s),an=ac.createAnalyser();an.fftSize=512;src.connect(an);p.an=an}catch(e){}}
const buf=new Uint8Array(512);
function loop(){
  if(!leaving){for(const [id,p] of peers){
    if(!p.an)continue;p.an.getByteTimeDomainData(buf);let sum=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v}
    let l=Math.min(1,Math.sqrt(sum/buf.length)*6);if(id==='self'&&muted)l=0;p.lvl=p.lvl*.7+l*.3;
    const el=document.querySelector(`.tile[data-id="${CSS.escape(id)}"]`);if(el){el.style.setProperty('--lvl',p.lvl.toFixed(2));el.classList.toggle('talk',p.lvl>.12)}
  }}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- отрисовка ---------- */
const ST={conn:['соединяюсь…',''],ok:['на связи','ok'],lost:['переподключаю…',''],bad:['не пробился, пробую ещё','bad']};
function tile(id,name,st,isMe){
  const s=ST[st]||ST.conn;
  return `<div class="tile" data-id="${esc(id)}">${isMe&&muted?'<div class="mute-badge">'+MIC_OFF+'</div>':''}
    <div class="av">${esc((name||'?').trim().charAt(0).toUpperCase()||'?')}</div>
    <div class="nm">${esc(name||'Кент')}${isMe?' (ты)':''}</div>
    <div class="ps ${isMe?'ok':s[1]}">${isMe?(muted?'микрофон выключен':'это ты'):s[0]}</div></div>`;
}
function render(){
  const others=Object.keys(members).filter(id=>id!==myId);
  for(const id of peers.keys())if(id!=='self'&&!others.includes(id)&&peers.get(id).state==='ok')others.push(id);
  $('#grid').innerHTML=tile('self',nick,'ok',true)+others.map(id=>tile(id,members[id],(peers.get(id)||{}).state,false)).join('')+
    (others.length?'':'<div class="empty">Пока никого. Скинь Кенту код <b>'+esc(code)+'</b> — или ссылку кнопкой «Скопировать»</div>');
}
function renderMute(){$('#mute').innerHTML=muted?MIC_OFF:MIC_ON;$('#mute').classList.toggle('off',muted)}
$('#mute').onclick=()=>{muted=!muted;if(local)local.getAudioTracks().forEach(t=>t.enabled=!muted);renderMute();render()};
$('#copy').onclick=async()=>{
  const link=location.href.split('#')[0]+'#'+code;
  try{await navigator.clipboard.writeText('Залетай в Кентофон, код комнаты: '+code+'\n'+link);toast('Код и ссылка скопированы')}
  catch(e){toast('Код: '+code)}
};
$('#tap').onclick=()=>{$('#tap').classList.remove('on');for(const p of peers.values())if(p.audio.srcObject)p.audio.play().catch(()=>{})};
$('#leave').onclick=leave;
function leave(){
  leaving=true;clearTimeout(joinT);
  for(const id of [...peers.keys()])drop(id);
  if(toHost)try{toHost.close()}catch(e){}toHost=null;
  hostConns.clear();
  if(host)try{host.destroy()}catch(e){}host=null;
  if(me)try{me.destroy()}catch(e){}me=null;myId='';
  if(local)local.getTracks().forEach(t=>t.stop());local=null;
  members={};
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  $('#room').hidden=true;$('#lobby').hidden=false;
  $('#code').value=code;
}
window.addEventListener('pagehide',()=>{if(!leaving){try{host&&host.destroy()}catch(e){}try{me&&me.destroy()}catch(e){}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!leaving&&me&&me.disconnected){try{me.reconnect()}catch(e){}}});
}
</script>
</body>
</html>
